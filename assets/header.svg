<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="250">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#06090F" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="cyberGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#131D2E" stroke-width="0.75" />
    </pattern>
  </defs>

  <rect width="850" height="250" rx="14" fill="url(#bgGrad)" stroke="#1F293D" stroke-width="1.5" />
  <rect width="850" height="250" rx="14" fill="url(#cyberGrid)" opacity="0.45" />

  <path d="M 0 14 Q 0 0 14 0 L 836 0 Q 850 0 850 14 L 850 38 L 0 38 Z" fill="#0E1524" />
  <line x1="0" y1="38" x2="850" y2="38" stroke="#1E293B" stroke-width="1.2" />

  <circle cx="24" cy="19" r="6" fill="#EF4444" />
  <circle cx="44" cy="19" r="6" fill="#F59E0B" />
  <circle cx="64" cy="19" r="6" fill="#10B981" />

  <text x="425" y="24" fill="#64748B" font-family="'Fira Code', Consolas, Monaco, monospace" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">syqopat@kernel: ~ (pts/0)</text>

  <rect x="735" y="10" width="95" height="18" rx="9" fill="#00FF9D1A" stroke="#00FF9D66" stroke-width="1" />
  <circle cx="747" cy="19" r="3.5" fill="#00FF9D">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="758" y="23" fill="#00FF9D" font-family="'Fira Code', Consolas, monospace" font-size="10" font-weight="700" letter-spacing="0.5">ONLINE</text>

  <text x="35" y="75" fill="#00E5FF" font-family="'Fira Code', Consolas, monospace" font-size="14" font-weight="700">❯ syqopat.init()</text>
  <text x="175" y="75" fill="#475569" font-family="'Fira Code', Consolas, monospace" font-size="13">--module security_core --mode full_stealth</text>

  <text x="35" y="125" fill="url(#textGrad)" font-family="'Fira Code', Consolas, monospace" font-size="34" font-weight="900" letter-spacing="3" filter="url(#neonGlow)">SYQOPAT WAS HERE</text>

  <text x="35" y="165" fill="#94A3B8" font-family="'Fira Code', Consolas, monospace" font-size="14">
    <tspan fill="#00FF9D" font-weight="700">TARGET: </tspan>
    <tspan fill="#E2E8F0">Low-Level Windows Auditing</tspan>
    <tspan fill="#64748B"> │ </tspan>
    <tspan fill="#00E5FF">Automation Engines</tspan>
    <tspan fill="#64748B"> │ </tspan>
    <tspan fill="#A78BFA">Network Tracers</tspan>
  </text>

  <rect x="35" y="195" width="780" height="32" rx="6" fill="#0B1324" stroke="#1E293B" stroke-width="1" />
  <text x="48" y="216" fill="#00FF9D" font-family="'Fira Code', Consolas, monospace" font-size="12" font-weight="700">SYS_INFO:</text>
  <text x="125" y="216" fill="#94A3B8" font-family="'Fira Code', Consolas, monospace" font-size="12">Verified Commits: <tspan fill="#00E5FF">Ed25519</tspan>  │  Engine: <tspan fill="#00FF9D">ContributionFarm</tspan>  │  Environment: <tspan fill="#E2E8F0">Win32 Internals</tspan></text>

  <rect x="795" y="202" width="7" height="17" fill="#00FF9D">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>
